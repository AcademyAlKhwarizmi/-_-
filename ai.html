<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>الخوارزمي AI | مساعد الرياضيات</title><link rel="stylesheet" href="css-platform.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script></head><body><div class="bg"><i class="orb one"></i><i class="orb two"></i><i class="orb three"></i></div>
<header class="topbar"><div class="container nav"><div class="brand"><div class="logo">خ</div><div><strong>الخوارزمي AI</strong><small>مساعد الرياضيات</small></div></div><div class="nav-actions"><button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">☾</button><a class="btn" href="home.html">← المنصة</a></div></div></header>
<main class="container"><section class="hero" style="min-height:auto"><div class="card ai-box" style="width:100%"><img class="ai-orb" src="assets/ai-orb.svg"><div><span class="eyebrow">AI • Math Tutor</span><h1 style="margin:10px 0">اسأل الخوارزمي 🤖</h1><p id="contextText" style="color:var(--muted);line-height:1.9">مساعدك في فهم الرياضيات وحل المسائل خطوة بخطوة، بدون ما يعطيك الإجابة فقط.</p></div></div></section>
<section><div class="card chat"><div id="messages" class="messages"><div class="msg">أهلاً بيك 👋 ابعتلي مسألة رياضيات أو اطلب شرح درس.</div></div><div class="chat-input"><input id="aiInput" class="field" placeholder="مثلاً: حل س² - 5س + 6 = 0 خطوة بخطوة"><button class="btn primary" id="sendBtn" onclick="askAI()">إرسال</button></div></div></section></main>
<script>
function toggleTheme(){const l=document.documentElement.classList.toggle('light');localStorage.setItem('kh-theme',l?'light':'dark');document.getElementById('themeBtn').textContent=l?'☀':'☾'}if(localStorage.getItem('kh-theme')==='light'){document.documentElement.classList.add('light');document.getElementById('themeBtn').textContent='☀'}
const params=new URLSearchParams(location.search), video=params.get('video');if(video)document.getElementById('contextText').textContent='أنت الآن داخل شات AI الخاص بفيديو: '+video+' — اسأل عن أي ثانية أو فكرة في الفيديو.';
function add(text,cls=''){const d=document.createElement('div');d.className='msg '+cls;d.textContent=text;document.getElementById('messages').appendChild(d);document.getElementById('messages').scrollTop=999999}
async function askAI(){const i=document.getElementById('aiInput'),q=i.value.trim(),b=document.getElementById('sendBtn');if(!q)return;i.value='';add(q,'user');b.disabled=true;b.textContent='...';try{const res=await fetch((window.SUPABASE_URL||'')+'/functions/v1/ai-chat',{method:'POST',headers:{'Content-Type':'application/json',...(window.SUPABASE_PUBLISHABLE_KEY?{'apikey':window.SUPABASE_PUBLISHABLE_KEY,'Authorization':'Bearer '+window.SUPABASE_PUBLISHABLE_KEY}:{})},body:JSON.stringify({message:q,video:video||null,subject:'رياضيات',language:'ar'})});const data=await res.json();if(!res.ok)throw new Error(data.error||'AI unavailable');add(data.reply||'لم يصل رد من المساعد.')}catch(e){console.error(e);add('المساعد غير متصل حاليًا. اربط Edge Function باسم ai-chat وأضف مفتاح مزود الذكاء الاصطناعي في Secrets داخل Supabase.')}finally{b.disabled=false;b.textContent='إرسال'}}
document.getElementById('aiInput').addEventListener('keydown',e=>{if(e.key==='Enter')askAI()});
</script></body></html>
